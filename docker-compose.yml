services:
  chromadb:
    image: chromadb/chroma:1.0.0
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000; printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\n\\r\\n' >&3; read -r s <&3; [[ $$s == *200* ]]"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  rag-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: rag-app
    depends_on:
      chromadb:
        condition: service_healthy
    env_file:
      - ./app/.env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    volumes:
      - ./app:/app
    ports:
      - "8080:8080"
    command: python main.py

volumes:
  chroma_data: